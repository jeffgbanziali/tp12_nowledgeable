name: clienthub-8013

services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    container_name: gbanziali_jeff_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant}
      MYSQL_DATABASE: clienthub
      MYSQL_USER: clienthub_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - clienthub-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME manquant}/clienthub-api:${IMAGE_TAG:-latest}
    container_name: gbanziali_jeff
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: clienthub
      DB_USER: clienthub_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
    ports:
      - "${APP_PORT:-8013}:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clienthub-net

networks:
  clienthub-net:
    driver: bridge

volumes:
  db_data: