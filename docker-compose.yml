services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    #container_name: clienthub-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: clienthub
      MYSQL_USER: clienthub_user
      MYSQL_PASSWORD: clienthub_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - clienthub-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./api
   # container_name: clienthub-api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: clienthub
      DB_USER: clienthub_user
      DB_PASSWORD: clienthub_pass
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clienthub-net

  web:
    image: nginx:alpine
   # container_name: clienthub-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - clienthub-net

networks:
  clienthub-net:
    driver: bridge

volumes:
  db_data:
