name: CI/CD ClientHub

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: clienthub-api

jobs:
  # ========================================================
  # JOB 1 : Tests unitaires
  # ========================================================
  unit-tests:
    name: 1 - Tests unitaires
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image de test
        run: docker build -t clienthub-api:test ./api

      - name: Lancer pytest (unitaires)
        run: docker run --rm clienthub-api:test python -m pytest -v -m "not integration"

  # ========================================================
  # JOB 2 : Tests d'intégration / E2E
  # ========================================================
  
  e2e-tests:
    name: 2 - Tests E2E
    runs-on: self-hosted
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------
      # Nettoyage préventif
      # ----------------------------------------------------
      - name: Nettoyer les conteneurs existants
        shell: powershell
        run: |
          docker compose down -v --remove-orphans

      # ----------------------------------------------------
      # Démarrage de MySQL + API + Web
      # ----------------------------------------------------
      - name: Démarrer la stack de test
        run: docker compose up -d --build

      # ----------------------------------------------------
      # Attendre que l'API soit disponible
      # ----------------------------------------------------
      - name: Vérifier que l'API est disponible
        shell: powershell
        run: |
          $maxAttempts = 40
          $attempt = 0

          while ($attempt -lt $maxAttempts) {
            $attempt++

            try {
              $response = Invoke-WebRequest `
                -Uri "http://localhost:5000/health" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -eq 200) {
                Write-Host "API disponible."
                exit 0
              }
            }
            catch {
              Write-Host "API pas encore disponible... tentative $attempt/$maxAttempts"
            }

            Start-Sleep -Seconds 3
          }

          Write-Host "L'API n'est pas disponible."
          docker compose ps
          docker compose logs

          exit 1

      # ----------------------------------------------------
      # Installer les dépendances Python pour les tests
      # ----------------------------------------------------
      - name: Installer les dépendances de test
        shell: powershell
        working-directory: api
        run: |
          python -m pip install -r requirements.txt

      # ----------------------------------------------------
      # Tests E2E
      # ----------------------------------------------------
      - name: Exécuter les tests E2E
        shell: powershell
        working-directory: api
        env:
          API_URL: http://localhost:5000
        run: |
          python -m pytest -v -m integration

      # ----------------------------------------------------
      # Logs en cas d'erreur
      # ----------------------------------------------------
      - name: Afficher les logs en cas d'erreur
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      # ----------------------------------------------------
      # Nettoyage final
      # ----------------------------------------------------
      - name: Arrêter et nettoyer la stack
        if: always()
        run: |
          docker compose down -v --remove-orphans
  


  # ========================================================
  # JOB 3 : Build et Push sur Docker Hub
  # ========================================================
  build-and-push:
    name: 3 - Build et push Docker Hub
    runs-on: self-hosted
    needs: e2e-tests
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/clienthub-api
    steps:
      - uses: actions/checkout@v4

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et Push de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # ========================================================
  # JOB 4 : Déploiement sur la VM Azure
  # ========================================================
  deploy:
    name: 4 - Déploiement VM
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Copie des fichiers de configuration sur la VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          source: "docker-compose.prod.yml,init.sql"
          target: "clienthub-8013"

      - name: Déploiement via SSH et vérification
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          envs: GITHUB_SHA
          script: |
            cd clienthub-8013
            cat << 'EOF' > .env
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            IMAGE_TAG=${GITHUB_SHA}
            APP_PORT=8013
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            EOF
            chmod 600 .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Vérification des endpoints
            curl -fsS --retry 10 --retry-delay 3 http://localhost:8013/health
            curl -fsS http://localhost:8013/who
            curl -fsS http://localhost:8013/clients