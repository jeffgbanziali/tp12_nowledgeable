name: CI/CD ClientHub

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: clienthub-api

jobs:
  unit-tests:
    name: 1 - Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Installer les dépendances
        working-directory: api
        run: pip install -r requirements.txt

      - name: Lancer les tests unitaires
        working-directory: api
        run: python -m pytest -v -m "not integration"

  e2e-tests:
    name: 2 - Tests E2E
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Démarrer la stack (db + api + web)
        run: docker compose up -d --build

      - name: Attendre que l'API réponde
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:5000/health; then exit 0; fi
            sleep 3
          done
          echo "L'API ne répond pas"
          docker compose logs
          exit 1

      - name: Installer les dépendances
        working-directory: api
        run: pip install -r requirements.txt

      - name: Lancer les tests E2E
        working-directory: api
        env:
          API_URL: http://localhost:5000
        run: python -m pytest -v -m integration

      - name: Afficher les logs en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêter la stack
        if: always()
        run: docker compose down -v

  build-and-push:
    name: 3 - Build et push Docker Hub
    runs-on: ubuntu-latest
    needs: e2e-tests
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push (tags latest + sha du commit)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: 4 - Déploiement sur la VM Azure
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host vm"
            echo "  HostName $VM_HOST"
            echo "  User $VM_USER"
            echo "  IdentityFile ~/.ssh/id_deploy"
          } > ~/.ssh/config

      - name: Préparer le fichier .env de production
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        run: |
          {
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
            echo "IMAGE_TAG=$GITHUB_SHA"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD"
          } > .env.prod

      - name: Copier les fichiers de déploiement sur la VM
        run: |
          ssh vm "mkdir -p clienthub"
          scp docker-compose.prod.yml init.sql vm:clienthub/
          scp -r site vm:clienthub/
          scp .env.prod vm:clienthub/.env
          ssh vm "chmod 600 clienthub/.env"

      - name: Déployer (idempotent)
        run: |
          ssh vm "set -e; cd clienthub; \
            docker compose -f docker-compose.prod.yml pull; \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans; \
            docker image prune -f"

      - name: Vérifier l'application via l'IP publique
        run: |
          curl -fsS --retry 30 --retry-delay 5 --retry-all-errors "http://$VM_HOST:5000/health"
          echo
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "http://$VM_HOST:5000/clients"
          echo
          curl -fsS -o /dev/null -w "Page web : HTTP %{http_code}\n" --retry 5 --retry-delay 3 --retry-all-errors "http://$VM_HOST/"